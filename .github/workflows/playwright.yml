name: Accessibility Tests & HTML Report

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  # Trigger when code is committed/pushed to an external dev repository
  repository_dispatch:
    types: [ dev-commit, run-accessibility-tests ]

jobs:
  test:
    name: Run Accessibility Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests & Generate Reports
        run: npx playwright test

      - name: Upload Accessibility HTML & CSV Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: reports/accessibility/
          retention-days: 30

      - name: Upload Playwright Standard Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
